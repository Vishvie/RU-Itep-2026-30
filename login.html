<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ravenshaw ITEP</title>
    <meta name="description" content="Administrator login for the Ravenshaw University ITEP portal.">
    <meta property="og:title" content="Admin Login | Ravenshaw ITEP">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
    <link rel="modulepreload" href="assets/js/firebase-init.js">
</head>
<body style="--nav-active-color: #5BE2FF;">

    <nav class="navbar" id="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="navbar-brand">
                <img src="assets/images/Ravenshaw_University_Logo.png" alt="Ravenshaw University" class="navbar-logo-img">
                <span class="navbar-title">ITEP 2026-2030</span>
            </a>
            <a href="index.html" aria-label="Home" style="color: var(--text-primary); font-size: 2.2rem; display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0.5rem; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                <ion-icon name="close-outline"></ion-icon>
            </a>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-card">
            <h2>Admin Login</h2>
            <p>Verify credentials to manage students, teachers and events...</p>
            
            <div id="login-error" class="error-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Verify</button>
            </form>
        </div>
    </section>

    <!-- Scripts -->
    <!-- Scripts -->

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './assets/js/firebase-init.js';

        // Check if already logged in, redirect to home
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace('index.html');
            }
        });

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            loginBtn.textContent = 'Authenticating...';
            loginBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // The onAuthStateChanged listener above will handle the redirect
            } catch (error) {
                errorDiv.textContent = 'Invalid credentials. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.textContent = 'Verify';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
